name: offline-checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install test dependencies
        run: >-
          python -m pip install
          numpy==1.26.3
          pandas==2.3.3
          scipy==1.15.3
          scikit-learn==1.7.2
          joblib==1.6.0
      - name: Compile
        run: python -m compileall -q *.py tools tests
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Repository safety check
        run: python tools/verify_project.py --skip-data --skip-artifacts
      - name: Git release check
        run: python tools/check_git_release.py
